<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>账号设置 — 咸鱼图床</title>
  <link rel="icon" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="nav-mount"></div>
  <main class="container page" data-title="设置">
    <h1 class="serif" style="margin-bottom:var(--s-5)">账号设置</h1>
    <div class="tabs">
      <button data-tab="profile" class="active">账号</button>
      <button data-tab="tokens">API Token</button>
    </div>

    <div id="tab-profile" class="stack">
      <div class="card card-pad">
        <h3 style="margin-bottom:var(--s-4)">账号信息</h3>
        <div class="grid-stats" id="profile-info"></div>
      </div>
      <div class="card card-pad">
        <h3 style="margin-bottom:var(--s-4)">修改密码</h3>
        <form id="pw-form" class="stack" style="max-width:420px">
          <div class="field"><label>当前密码</label><input class="input" type="password" name="current" autocomplete="current-password" required></div>
          <div class="field"><label>新密码</label><input class="input" type="password" name="new" autocomplete="new-password" required></div>
          <div class="field"><label>确认新密码</label><input class="input" type="password" name="new2" autocomplete="new-password" required></div>
          <div><button class="btn btn-primary" type="submit">更新密码</button></div>
          <p class="field-help">修改密码后，所有设备需要重新登录。</p>
        </form>
      </div>
    </div>

    <div id="tab-tokens" class="hide stack">
      <div class="card card-pad">
        <div class="between" style="margin-bottom:var(--s-4)">
          <div><h3>API Token</h3><p class="muted" style="font-size:.86rem;margin-top:4px">用于 PicGo、脚本或客户端上传。请妥善保管，创建后仅显示一次。</p></div>
        </div>
        <form id="tok-form" class="row wrap" style="gap:10px;align-items:flex-end">
          <div class="field grow" style="min-width:200px"><label>名称</label><input class="input" name="name" placeholder="例如：PicGo 笔记本"></div>
          <button class="btn btn-primary" type="submit"><span id="tok-ico"></span>生成 Token</button>
        </form>
        <div class="table-wrap" style="margin-top:var(--s-4)">
          <table class="table" id="tok-table">
            <thead><tr><th>名称</th><th>Token 前缀</th><th>最近使用</th><th>创建时间</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="card card-pad" style="margin-top:var(--s-4);background:var(--surface-2)">
          <div class="row" style="gap:10px;align-items:flex-start"><span style="color:var(--text-subtle)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span><div><strong style="font-size:.9rem">如何使用</strong><p class="muted" style="font-size:.84rem;margin-top:6px">上传时在请求头携带 <code class="code">Authorization: Bearer rpic_xxx</code>，接口为 <code class="code">POST /api/upload</code>（表单字段 <code class="code">file</code>）。</p></div></div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-mount"></div>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/page-settings.js"></script>
</body>
</html>
