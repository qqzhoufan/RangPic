<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 — 咸鱼图床</title>
  <link rel="icon" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="nav-mount"></div>
  <main class="auth-wrap" data-title="登录">
    <div class="auth-card">
      <div class="center" style="margin-bottom:var(--s-5)">
        <div class="brand" style="justify-content:center;font-size:1.6rem"><span class="mark" id="mk"></span></div>
        <h1 class="serif" style="margin-top:var(--s-4)">欢迎回来</h1>
        <p class="muted">登录以管理你的图片与相册</p>
      </div>
      <form id="auth-form" class="stack">
        <div class="field">
          <label>用户名</label>
          <input class="input" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="field">
          <label>密码</label>
          <input class="input" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="submit-btn">登录</button>
      </form>
      <p class="auth-alt">还没有账号？<a href="/register">立即注册</a></p>
    </div>
  </main>
  <div id="footer-mount"></div>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/page-auth.js"></script>
</body>
</html>
