# 对外只有一个端口。数据库和上传文件都在 DATA_DIR 里，
# 重新构建镜像不会删除这个目录。
#
#   PORT=17777 DATA_DIR=./rangpic-data docker compose up --build -d
#
# 管理员账号和密码改下面两项，然后执行 docker compose up -d。
services:
  rangpic:
    build: .
    image: zhouwl/rangpic:0.2.0
    container_name: rangpic
    restart: unless-stopped
    ports:
      - "${PORT:-17777}:17777"
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      SITE_URL: ${SITE_URL:-}
    volumes:
      - ${DATA_DIR:-./rangpic-data}:/data
