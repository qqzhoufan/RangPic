# Build zhouwl/rangpic for linux/amd64 and linux/arm64 on native runners.
# Tag pushes (v*) and manual runs publish :<version> and :latest.
# Pushes and pull requests to master only build, so a broken Dockerfile fails CI
# before anyone publishes.

name: Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer master or PR commit replaces the in-flight build. Release publishes
# are left alone so a tag is not cancelled halfway through the registry push.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  IMAGE: zhouwl/rangpic

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide whether to push
        id: push
        run: |
          set -euo pipefail
          push=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            push=true
          fi
          echo "push=${push}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `latest` is added explicitly below. `auto` would also tag it on
          # semver events and would not cover a manual run from a branch.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ steps.push.outputs.push == 'true' }}
          labels: |
            org.opencontainers.image.title=RangPic
            org.opencontainers.image.description=Self-hosted image host with a random-image API

      - name: Login to Docker Hub
        if: steps.push.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One platform per runner. On publish, push the untagged image by digest;
      # the merge job attaches tags. Provenance is off so the digest is the
      # image manifest itself (an attestation index breaks the manifest merge).
      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max,ignore-error=true
          outputs: ${{ steps.push.outputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}

      - name: Export digest
        if: steps.push.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "build-push-action did not return an image digest" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: steps.push.outputs.push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 -type f | wc -l)"
          if [ "${count}" -ne 2 ]; then
            echo "expected 2 architecture digests, found ${count}" >&2
            find . -maxdepth 1 -type f -print >&2
            exit 1
          fi
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}")"
          if [ -z "${tags}" ] || [ "${tags}" = "null" ]; then
            echo "metadata-action produced no tags" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create ${tags} $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:latest"
